# PekoHub API production on Fly.io — `fly deploy -c fly.production.toml --ha=false`
#
# The same minimal shape as staging (fly.staging.toml), with production
# hostnames: one small machine that stops when no request or tunnel is
# open and starts on the next one (a second or two), on Neon's free tier.
# No Fly health check: /health queries the database, so a check every 30 s
# would keep free-tier Neon awake around the clock and spend its monthly
# compute. DEPLOYMENT.md § "Production: Fly.io + Neon" has the setup and
# what to turn on when traffic grows (always-on, paid Neon, backups).
#
# Exactly one machine: the tunnel relay keeps runtime connections in
# process (services/tunnel-manager.ts), so a second machine would split
# them. `--ha=false` stops Fly from creating a standby. A deploy replaces
# the machine in place; connected runtimes reconnect within seconds.
#
# Secrets (`fly secrets set -c fly.production.toml ...`):
#   DATABASE_URL            Neon's pooled connection string
#   MIGRATION_DATABASE_URL  Neon's direct one, for the release command
#   JWT_SECRET              32+ chars; keep the old value when moving, or
#                           every session and bridge-token key changes
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET (and the GOOGLE_ pair, optional)
#   SENTRY_DSN              optional; error tracking
#   METRICS_TOKEN           optional, 32+ chars; without it /metrics is off

app = "pekohub"
primary_region = "iad" # next to Neon's aws-us-east-1

[build]
  dockerfile = "backend/Dockerfile"
  ignorefile = "backend/Dockerfile.dockerignore"

[deploy]
  # drizzle-kit is a runtime dependency; the journal makes this idempotent.
  release_command = "npx drizzle-kit migrate --config=drizzle.config.ts"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  PUBLIC_ORIGIN = "https://api.pekohub.ai"
  REGISTRY_BASE_URL = "https://api.pekohub.ai"
  FRONTEND_URL = "https://pekohub.ai"
  ALLOW_DEV_AUTH_BYPASS = "false"
  ALLOW_VISITOR_CHAT = "false"
  SENTRY_ENVIRONMENT = "production"

[http_service]
  internal_port = 3000
  force_https = true
  # Stops when idle, like staging; a connected runtime's tunnel keeps it
  # running. For no cold starts: auto_stop_machines = "off",
  # min_machines_running = 1 (and a paid Neon plan before adding a check).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Every connected runtime holds one connection for as long as it is
  # online, so the limit is the number of runtimes plus live requests.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
