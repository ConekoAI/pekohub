name: Deploy Staging

# Deploys staging after CI passes on master: the API to Fly.io
# (`fly.staging.toml`, Neon Postgres) and the website to the Cloudflare
# Pages project `pekohub-staging`. Production (pekohub.ai via Pages' Git
# integration, api.pekohub.ai via deploy-lightsail.yml) is untouched.
# DEPLOYMENT.md § "Staging: Fly.io + Neon".
#
# Manual redeploy: `gh workflow run deploy-staging.yml --ref master`.
#
# Required GitHub Secrets (a job without its secret is skipped, not failed):
#   FLY_API_TOKEN          - `fly tokens create deploy -a pekohub-staging`
#   CLOUDFLARE_API_TOKEN   - Cloudflare API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account holding `pekohub-staging`

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# One staging deploy at a time; a newer master supersedes a queued one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  STAGING_API: https://pekohub-staging.fly.dev

jobs:
  api:
    name: API → Fly.io
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip without a Fly token
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN is not set; skipping the staging API deploy."

      - name: Checkout
        if: env.FLY_API_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy (migrations run as the release command)
        if: env.FLY_API_TOKEN != ''
        run: >
          flyctl deploy -c fly.staging.toml --ha=false --remote-only
          --env SENTRY_RELEASE=${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Health check
        if: env.FLY_API_TOKEN != ''
        run: |
          for _ in $(seq 1 15); do
            curl -sf "$STAGING_API/health" && exit 0
            sleep 4
          done
          echo "::error::$STAGING_API/health did not answer"
          exit 1

  web:
    name: Website → Cloudflare Pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without a Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the staging website deploy."

      - name: Checkout
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Build
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @pekohub/shared build
          VITE_API_BASE_URL="$STAGING_API" pnpm --filter @pekohub/frontend build
        env:
          # Optional error tracking; the Pages project needs the same
          # VITE_SENTRY_DSN variable for its CSP (DEPLOYMENT.md § Error tracking).
          VITE_SENTRY_DSN: ${{ vars.STAGING_WEB_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: staging
          VITE_SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}

      # From the repo root, so the Pages Functions in `functions/` deploy too.
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >
          npx --yes wrangler@4 pages deploy frontend/dist
          --project-name pekohub-staging --branch main
          --commit-hash "${{ github.event.workflow_run.head_sha || github.sha }}"
